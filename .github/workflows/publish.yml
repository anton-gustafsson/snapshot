name: Publish npm packages

on:
  push:
    branches: [master]
    paths:
      - 'packages/**'
  workflow_dispatch: {}

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      # --no-workspaces-update matters: `^0.0.x` is patch-locked, so the moment
      # core is bumped to 0.0.(x+1) it no longer satisfies snapshot-angular's
      # `^0.0.x` range, and npm's automatic workspace update would install the
      # *published* core into packages/angular/node_modules — shadowing the
      # workspace symlink, so the Angular build would compile against the last
      # release's typings and fail on anything newly exported. The dependency
      # range is realigned right after, then the lockfile is synced on its own.
      - name: Bump patch versions
        run: |
          npm version patch --no-git-tag-version --no-workspaces-update -w packages/core
          npm version patch --no-git-tag-version --no-workspaces-update -w packages/angular
          CORE_VERSION=$(node -p "require('./packages/core/package.json').version")
          npm pkg set "dependencies.@anton-gustafsson/snapshot-core=^$CORE_VERSION" -w packages/angular
          npm install --package-lock-only

      - name: Build packages
        run: npm run build:packages

      - name: Publish @anton-gustafsson/snapshot-core
        run: npm publish -w packages/core --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @anton-gustafsson/snapshot-angular
        run: npm publish packages/angular/dist --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/core/package.json packages/angular/package.json package-lock.json
          git commit -m "chore: bump package versions [skip ci]" || echo "nothing to commit"
          git push
