[build]
  command = "npm install && npm run build -w apps/docs && npm run build -w apps/gallery && mkdir -p apps/docs/dist/examples && cp -r apps/gallery/dist/. apps/docs/dist/examples/"
  publish = "apps/docs/dist"

[build.environment]
  NODE_VERSION = "20"

# Gallery is a client-side-routed SPA (Navigo) mounted under /examples/ —
# deep links and refreshes need to fall back to its index.html.
[[redirects]]
  from = "/examples/*"
  to = "/examples/index.html"
  status = 200
